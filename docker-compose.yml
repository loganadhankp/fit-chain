version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthchain-postgres
    environment:
      POSTGRES_DB: healthchain
      POSTGRES_USER: healthchain
      POSTGRES_PASSWORD: healthchain_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthchain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

