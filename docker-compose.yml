  ai-service:
    build: ./ai-service
    container_name: healthchain-ai
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

