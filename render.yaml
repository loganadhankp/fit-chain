services:
  # Backend API
  - type: web
    name: fit-chain-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: fit-chain-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

  # AI Microservice
  - type: web
    name: fit-chain-ai
    env: docker
    rootDir: ai-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8000

  # Oracle Background Worker
  - type: worker
    name: fit-chain-oracle
    env: node
    rootDir: oracle-service
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fit-chain-db
          property: connectionString

databases:
  - name: fit-chain-db
    plan: free
