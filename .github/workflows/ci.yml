name: CI & Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts:
    name: Blockchain Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: blockchain/package-lock.json
      - name: Install dependencies
        run: cd blockchain && npm ci
      - name: Compile and test contracts
        run: cd blockchain && npx hardhat test

  backend:
    name: Backend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: Generate Prisma Client
        run: cd backend && npx prisma generate
      - name: Build TypeScript
        run: cd backend && npm run build

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build Next.js
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_PUBLIC_CHAIN_ID: 31337
          NEXT_PUBLIC_NFT_CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"

  ai-service:
    name: AI Service Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: cd ai-service && pip install -r requirements.txt
      - name: Check app imports
        run: cd ai-service && python -c "from app.main import app; print('AI app loaded successfully')"
